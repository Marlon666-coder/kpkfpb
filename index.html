<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petualangan FPB & KPK</title>
  <!-- Font ramah anak. Jika offline, otomatis memakai font cadangan. -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="home">

  <!-- Hiasan latar (awan) -->
  <div class="sky" aria-hidden="true">
    <span class="cloud c1">☁️</span>
    <span class="cloud c2">☁️</span>
    <span class="cloud c3">☁️</span>
  </div>

  <!-- ========== BAR ATAS ========== -->
  <header id="topbar">
    <button class="icon-btn home-btn" data-go="home" title="Beranda">🏠</button>
    <div class="player"><span id="tb-avatar">👧</span><span id="tb-name">Rani</span></div>
    <div class="top-stats">
      <span class="pill">⭐ <b id="tb-stars">0</b></span>
      <span class="pill">🪙 <b id="tb-coins">0</b></span>
    </div>
    <button class="icon-btn" id="btn-music" title="Musik">🎵</button>
    <button class="icon-btn" id="btn-sound" title="Efek suara">🔊</button>
  </header>

  <main id="app">

    <!-- ========== 1. HOME ========== -->
    <section id="screen-home" class="screen active">
      <div class="home">
        <div class="hero-chars">
          <span class="float">🍎</span>
          <span id="home-avatar" class="bounce hero-main">👧</span>
          <span class="float d2">🐰</span>
        </div>
        <h1 class="title">🌟 Petualangan FPB &amp; KPK 🌟</h1>
        <p class="subtitle">Belajar matematika sambil bermain!</p>

        <div class="avatar-pick">
          <p>Pilih temanmu:</p>
          <div id="avatar-list" class="avatar-list"></div>
        </div>

        <div class="home-buttons">
          <button class="btn btn-primary btn-big" data-go="map">▶ Mulai Bermain</button>
          <button class="btn btn-secondary btn-big" data-go="learn">📚 Belajar</button>
          <button class="btn btn-accent btn-big" data-go="reward">🏆 Prestasi</button>
          <button class="btn btn-light" data-go="progress">📊 Progress Belajar</button>
        </div>
      </div>
    </section>

    <!-- ========== 2. PILIH LEVEL (PETA) ========== -->
    <section id="screen-map" class="screen">
      <div class="screen-head">
        <button class="btn btn-light btn-small" data-go="home">◀ Kembali</button>
        <h2>🗺️ Pilih Level</h2>
      </div>
      <div id="world-list" class="world-list"></div>
    </section>

    <!-- ========== 3 & 4. MENU BELAJAR ========== -->
    <section id="screen-learn" class="screen">
      <div class="screen-head">
        <button class="btn btn-light btn-small" data-go="home">◀ Kembali</button>
        <h2>📚 Belajar</h2>
      </div>
      <p class="lead">Pilih pelajaran. Singkat dan seru! 😊</p>
      <div class="learn-grid">
        <button class="learn-card lc-fpb" data-tutorial="fpb">
          <span class="lc-icon">🏰</span>
          <span class="lc-title">Belajar FPB</span>
          <span class="lc-sub">Membagi sama rata</span>
          <span class="lc-done" id="done-fpb"></span>
        </button>
        <button class="learn-card lc-kpk" data-tutorial="kpk">
          <span class="lc-icon">🚀</span>
          <span class="lc-title">Belajar KPK</span>
          <span class="lc-sub">Kapan mereka bertemu?</span>
          <span class="lc-done" id="done-kpk"></span>
        </button>
      </div>
    </section>

    <!-- ========== TUTORIAL (dipakai FPB & KPK) ========== -->
    <section id="screen-tutorial" class="screen">
      <div class="screen-head">
        <button class="btn btn-light btn-small" id="tut-exit">◀ Keluar</button>
        <h2 id="tut-title">Belajar</h2>
      </div>
      <div class="tut-dots" id="tut-dots"></div>
      <div class="card tut-card">
        <h3 id="tut-slide-title"></h3>
        <div id="tut-body"></div>
      </div>
      <div class="tut-nav">
        <button class="btn btn-light" id="tut-prev">◀ Kembali</button>
        <button class="btn btn-primary" id="tut-next">Lanjut ▶</button>
      </div>
    </section>

    <!-- ========== 5. MINI GAME ========== -->
    <section id="screen-game" class="screen">
      <div class="game-head">
        <button class="btn btn-light btn-small" id="game-exit">◀</button>
        <div class="game-title">
          <span id="game-world"></span>
          <b id="game-level"></b>
        </div>
        <span class="pill">🪙 <b id="run-points">0</b></span>
      </div>

      <div class="q-progress">
        <div class="q-bar"><div id="q-bar-fill"></div></div>
        <span id="q-count"></span>
      </div>

      <div class="card q-card">
        <div class="guide-row">
          <div class="guide-avatar bounce" id="guide-avatar">🦉</div>
          <div class="bubble" id="q-story"></div>
        </div>
        <div id="q-visual" class="q-visual"></div>
        <div id="q-preview" class="q-preview"></div>
        <div id="q-answers" class="q-answers"></div>
        <div id="guide-msg"></div>
        <div id="hint-box"></div>
        <div class="hint-row">
          <button class="btn btn-yellow" id="btn-hint">💡 Petunjuk</button>
        </div>
        <div id="feedback"></div>
      </div>
    </section>

    <!-- ========== 6. HASIL ========== -->
    <section id="screen-result" class="screen">
      <div class="card result-card" id="result-box"></div>
    </section>

    <!-- ========== 7. REWARD / PRESTASI ========== -->
    <section id="screen-reward" class="screen">
      <div class="screen-head">
        <button class="btn btn-light btn-small" data-go="home">◀ Kembali</button>
        <h2>🏆 Prestasi</h2>
      </div>
      <div id="reward-box"></div>
    </section>

    <!-- ========== 8. PROGRESS ========== -->
    <section id="screen-progress" class="screen">
      <div class="screen-head">
        <button class="btn btn-light btn-small" data-go="home">◀ Kembali</button>
        <h2>📊 Progress Belajar</h2>
      </div>
      <div id="progress-box"></div>
    </section>

  </main>

  <!-- Jendela pesan (modal) -->
  <div id="modal" class="modal hidden">
    <div class="modal-card pop">
      <div class="modal-icon" id="modal-icon"></div>
      <h2 id="modal-title"></h2>
      <div id="modal-text" class="modal-text"></div>
      <div id="modal-buttons" class="modal-buttons"></div>
    </div>
  </div>

  <!-- Tempat efek konfeti -->
  <div id="confetti" aria-hidden="true"></div>

  <script src="music.js"></script>
  <script src="script.js"></script>
</body>
</html>
